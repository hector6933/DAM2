<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p3</title>

    <script>
        
        var x = [1, 2, 3];
        var y = [2, 3, 10, 2];
        // Damos la vuelta a un vector
        x.reverse();
        alert(x);
        // Ordenamos 
        // y.sort() esto ordena alfabéticamente aunque sean números
        y.sort((a,b) => a - b)
        alert(y);
        // Sacamos y eliminamos elemento
        var sacado = y.pop();
        alert(sacado);
        alert(y);

    </script>
</head>
