    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej9</title>
    <script>
        // C3PO, R2, Vader o luck 

        const input = prompt("Introduce un personaje:")

        switch (input.toUpperCase()) {

            case "C3P0":
            case "R2":
            case "VADER":
            case "LUCK":
                alert("Es un personaje de star wars")
                break
            default:
                alert("No es un personaje de star wars")    
                break

        }

    </script>
