<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej11</title>
    <script>

        let num = ""
        do {

            num = parseInt(prompt("Introduce un número entero"))
            if (!Number.isInteger(num)) {

                alert("Eso NO es un número entero!")

            } else break

        } while (true)

        alert(`Número de cifras: ${num.toString().length}`)

    </script>
